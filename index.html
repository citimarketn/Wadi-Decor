<style>
:root{--teal:#0E4A47;--teal2:#0A3836;--brass:#B98A34;--bone:#F5F6F3;--stone:#E3E8E4;--sage:#CFDBD5;--ink:#172321;--mute:#55655F;--sale:#B4372B;--ok:#2B7A4B;--line:#D5DDD8}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.75 'Tajawal','Segoe UI',Tahoma,sans-serif;color:var(--ink);background:var(--bone);min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
h1,h2,h3,.brandname{font-family:'Reem Kufi','Tajawal',sans-serif;line-height:1.35;margin:0;font-weight:700}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
.wrap{width:min(1200px,calc(100% - 32px));margin-inline:auto}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;font-weight:700;transition:background .15s,color .15s;background:none;text-align:center}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-brass{background:var(--brass);color:#1b1407}.btn-brass:hover{background:#c9993f}
.btn-teal{background:var(--teal);color:#fff}.btn-teal:hover{background:var(--teal2)}
.btn-line{border-color:var(--teal);color:var(--teal)}.btn-line:hover{background:var(--sage)}
.btn-white{border-color:rgba(255,255,255,.6);color:#fff}.btn-white:hover{background:rgba(255,255,255,.12)}
.btn-danger{background:var(--sale);color:#fff}
.btn-wa{background:#1FA855;color:#fff}.btn-wa:hover{background:#188a45}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn-block{width:100%}
.ico{width:20px;height:20px;flex:none}
.notice{background:var(--teal2);color:#dfeae6;font-size:14px}
.notice .wrap{display:flex;gap:8px;align-items:center;justify-content:center;padding:6px 0;text-align:center}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar{display:flex;align-items:center;gap:16px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;flex:none}

.brandname{font-size:20px;color:var(--teal);white-space:nowrap}

.search{flex:1;display:flex;max-width:520px;margin-inline:auto}
.search input{flex:1;min-width:0;height:44px;border:1.5px solid var(--line);border-inline-end:0;border-radius:0 10px 10px 0;padding:0 14px;background:var(--bone)}
.search button{width:48px;border:0;background:var(--teal);color:#fff;border-radius:10px 0 0 10px;cursor:pointer;display:grid;place-items:center}
.tools{display:flex;gap:8px;align-items:center;margin-inline-start:auto;position:relative}
.tbtn{position:relative;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:700}
.tbtn:hover{border-color:var(--teal)}
.badge{position:absolute;top:-7px;inset-inline-start:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--brass);color:#1b1407;font-size:12px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:250px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(10,56,54,.16);padding:6px;z-index:40}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:start;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--stone)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.menu .who{padding:8px 12px;font-size:14px;color:var(--mute)}
.catbar{border-top:1px solid var(--line);background:#fff}
.catbar .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.catbar a{flex:none;padding:9px 14px;font-size:15px;font-weight:500;color:var(--mute);border-bottom:3px solid transparent}
.catbar a:hover,.catbar a.on{color:var(--teal);border-color:var(--brass)}
.hero{background:var(--teal);color:#fff;overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:end;padding-top:44px}

.cta{display:flex;gap:12px;flex-wrap:wrap}
.arch{position:relative;justify-self:center;width:min(100%,400px);aspect-ratio:480/560;border-radius:999px 999px 0 0;overflow:hidden;border:6px solid var(--brass);border-bottom:0;background:var(--sage)}
.arch svg{width:100%;height:100%}
.promo{position:absolute;inset-block-start:26%;inset-inline-start:-4px;z-index:2;width:104px;height:104px;border-radius:50%;background:var(--brass);color:#1b1407;display:grid;place-items:center;text-align:center;font:700 15px/1.25 'Reem Kufi',sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:rotate(-8deg)}

.archwrap{position:relative;justify-self:center;width:min(100%,400px)}
.trust{background:#fff;border-bottom:1px solid var(--line)}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.trust svg{color:var(--brass);width:28px;height:28px}

.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px}
.sh h2{font-size:28px;color:var(--teal)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:center;transition:border-color .15s}
.tile:hover{border-color:var(--teal)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card .im{position:relative;display:block}
.card .im img{aspect-ratio:4/3;object-fit:cover;width:100%}
.sale{position:absolute;top:10px;inset-inline-start:10px;background:var(--sale);color:#fff;border-radius:8px;padding:2px 10px;font-weight:700;font-size:14px}
.card .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font:700 16px/1.5 'Tajawal',sans-serif}
.cat-l{font-size:13px;color:var(--mute)}
.price{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:auto}
.price b{font-size:19px;color:var(--teal)}
.price s{color:var(--mute);font-size:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.chip{padding:6px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-weight:500;font-size:15px;cursor:pointer}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
select,input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],textarea{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
textarea{min-height:110px;resize:vertical;line-height:1.7}
select{width:auto}
label.f{display:block;margin-bottom:14px;font-weight:700;font-size:15px}
label.f>span{display:block;margin-bottom:4px}
label.f small{font-weight:400;color:var(--mute)}
.err{color:var(--sale);font-size:14px;min-height:22px;margin:0 0 8px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding:32px 0}
.pd .pic{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.pd .pic img{width:100%;aspect-ratio:4/3;object-fit:cover}
.pd h1{font-size:32px;color:var(--teal)}
.pd .price b{font-size:30px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.qty button{width:40px;height:42px;border:0;background:none;font-size:20px;cursor:pointer}
.qty span{min-width:34px;text-align:center;font-weight:700}
.crumbs{font-size:14px;color:var(--mute);padding-top:20px}
.crumbs a{color:var(--teal)}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;padding:28px 0;align-items:start}
.line{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.line img{width:84px;height:64px;object-fit:cover;border-radius:8px}
.line h3{font:700 16px 'Tajawal',sans-serif}
.rm{border:0;background:none;color:var(--sale);cursor:pointer;font-size:14px;padding:4px 0}
.sum{display:flex;justify-content:space-between;padding:6px 0}
.sum.t{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:19px;font-weight:700;color:var(--teal)}
.empty{text-align:center;padding:56px 16px;color:var(--mute)}
.empty svg{margin:0 auto 12px;color:var(--brass);width:48px;height:48px}
.pay{display:grid;gap:10px;margin-bottom:14px}
.pay label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff}
.pay input{margin-top:6px;accent-color:var(--teal)}
.pay label:has(input:checked){border-color:var(--teal);background:#eef4f1}
.hint{background:#eef4f1;border:1px dashed var(--teal);border-radius:10px;padding:12px;font-size:15px;margin-bottom:14px}
.status{display:inline-block;padding:2px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--sage);color:var(--teal)}
.status.delivered{background:#d8eee1;color:var(--ok)}.status.cancelled{background:#f5d9d5;color:var(--sale)}
.tl{list-style:none;display:flex;padding:0;margin:14px 0 4px;gap:0}
.tl li{flex:1;text-align:center;font-size:13px;color:var(--mute);position:relative;padding-top:22px;line-height:1.4}
.tl li::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--line);border-radius:3px;margin-inline:2px}
.tl li.on{color:var(--teal);font-weight:700}

.soc{display:flex;gap:10px;margin-top:10px}
.soc button{border:0;background:none;padding:0;cursor:pointer;width:40px;height:40px;border-radius:50%}
.soc svg{width:40px;height:40px}
.overlay{position:fixed;inset:0;background:rgba(10,30,28,.55);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;position:relative}
.modal.wide{width:min(640px,100%)}
.modal h2{font-size:24px;color:var(--teal);margin-bottom:6px}
.x{position:absolute;top:12px;inset-inline-start:12px;width:36px;height:36px;border:0;background:var(--stone);border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1;height:42px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.shield{display:flex;gap:10px;align-items:center;background:#eef4f1;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px;color:var(--teal2)}
.shield svg{color:var(--ok);flex:none}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.soc-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:700;cursor:pointer;margin-bottom:8px}
.soc-btn:hover{background:var(--bone)}
.soc-btn svg{width:22px;height:22px}
.link{background:none;border:0;color:var(--teal);text-decoration:underline;cursor:pointer;padding:0;font-weight:500}
.toast{position:fixed;bottom:20px;inset-inline:16px;margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.adm-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
.tbl th,.tbl td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{background:var(--stone);font-size:14px}
.tbl img.th{width:56px;height:42px;object-fit:cover;border-radius:6px}
.tbl input[type=number]{width:110px;min-height:38px}
.scroll{overflow-x:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;background:var(--stone)}
@media (max-width:900px){
 .hero-in{grid-template-columns:1fr;padding-top:32px}.hero-txt{padding-bottom:0}.arch,.archwrap{margin-top:8px}
 .pd,.two{grid-template-columns:1fr}.ft .cols{grid-template-columns:1fr 1fr}
 .trust .wrap{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
 .bar{flex-wrap:wrap;gap:10px}.search{order:3;flex-basis:100%;max-width:none}
 .brandname{font-size:17px}.tbtn .lbl{display:none}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
 .card .in{padding:10px}.price b{font-size:16px}
 .ft .cols{grid-template-columns:1fr}
 .line{grid-template-columns:64px 1fr}.line img{width:64px;height:52px}.line .end{grid-column:1/-1}
 .row2{grid-template-columns:1fr}.tl li{font-size:11px}
 .sh h2{font-size:23px}
}
</style>
</head>

const enc=new TextEncoder();
async function pbk(secret,salt){
  if(!(window.crypto&&crypto.subtle))throw new Error('المتصفح لا يدعم التشفير المطلوب. استخدم متصفحًا حديثًا.');
  const k=await crypto.subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
const lockLeft=k=>{const l=store.get(k,{n:0,t:0});return l.t>Date.now()?Math.ceil((l.t-Date.now())/60000):0};
const lockFail=k=>{const l=store.get(k,{n:0,t:0});l.n++;if(l.n>=5){l.t=Date.now()+10*60000;l.n=0}store.set(k,l)};
const lockOk=k=>store.set(k,{n:0,t:0});
function normIdent(v){
  v=String(v||'').trim().replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));
  if(v.includes('@'))return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)?{type:'email',v:v.toLowerCase()}:null;
  let d=v.replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(/^01[0125]\d{8}$/.test(d))d='2'+d;
  return /^201[0125]\d{8}$/.test(d)?{type:'phone',v:d}:null;
}
const fbEmail=i=>i.type==='email'?i.v:i.v+'@phone.wadi.local';

const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('تعذر تحميل '+src));document.head.appendChild(s)});

function openModal(html,wide){$('#modal').innerHTML=`<div class="overlay" data-act="ovl"><div class="modal${wide?' wide':''}" role="dialog" aria-modal="true"><button class="x" data-act="closeModal" aria-label="إغلاق">×</button>${html}</div></div>`;const f=$('#modal input,#modal textarea,#modal select');if(f)f.focus()}
function closeModal(){$('#modal').innerHTML=''}
function closeMenu(){if(S.menu){S.menu=false;renderHeader()}}
const paras=t=>String(t||'').split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return'';if(b.startsWith('# '))return `<h3>${esc(b.slice(2))}</h3>`;return `<p>${esc(b).replace(/\n/g,'<br>')}</p>`}).join('');
function card(p){
  const d=disc(p);
  return `<article class="card"><a class="im" href="#/p/${esc(p.id)}" aria-label="${esc(p.name)}"><img src="${imgOf(p)}" alt="${esc(p.name)}" loading="lazy">${d?`<span class="sale">-${d}%</span>`:''}</a><div class="in"><span class="cat-l">${esc(catName(p.cat))}</span><h3><a href="#/p/${esc(p.id)}">${esc(p.name)}</a></h3><div class="price"><b>${egp(p.price)}</b>${p.old>p.price?`<s>${egp(p.old)}</s>`:''}</div><button class="btn btn-teal btn-sm" data-act="add" data-id="${esc(p.id)}" ${p.stock===0?'disabled':''}>${p.stock===0?'غير متوفر':'أضف إلى السلة'}</button></div></article>`;
}

    <div class="archwrap">${md?`<div class="promo"><span>خصم حتى<b>${nf.format(md)}%</b></span></div>`:''}<div class="arch">${HERO_SCENE}</div></div>
  </div></section>

    <div>${IC.back}<span><b>سياسة استرجاع واضحة</b><span>مكتوبة ومعلنة للجميع</span></span></div>

  <section class="blk" style="padding-top:0"><div class="wrap"><div class="sh"><h2>وصل حديثًا</h2><a href="#/shop">كل المنتجات</a></div><div class="grid">${S.products.slice(-8).reverse().map(card).join('')||'<p class="empty">لا توجد منتجات بعد.</p>'}</div></div></section>`;
}
function vShop(q){
  let list=S.products.slice();const c=q.c,term=(q.q||'').trim().toLowerCase(),sort=q.s||'';
  if(c)list=list.filter(p=>p.cat===c);
  if(term)list=list.filter(p=>(p.name+' '+p.desc+' '+catName(p.cat)).toLowerCase().includes(term));
  if(sort==='asc')list.sort((a,b)=>a.price-b.price);else if(sort==='desc')list.sort((a,b)=>b.price-a.price);else if(sort==='disc')list=list.filter(p=>disc(p)>0).sort((a,b)=>disc(b)-disc(a));
  const url=(o)=>'#/shop?'+new URLSearchParams(Object.fromEntries(Object.entries({c,q:q.q,s:sort,...o}).filter(([,v])=>v))).toString();
  return `<div class="wrap" style="padding:28px 0 8px"><h1 style="font-size:30px;color:var(--teal);margin-bottom:16px">${c?esc(catName(c)):(term?`نتائج البحث عن "${esc(q.q)}"`:'كل المنتجات')}</h1>
  <div class="filters"><a class="chip ${!c?'on':''}" href="${url({c:''})}">الكل</a>${S.cats.map(k=>`<a class="chip ${c===k.id?'on':''}" href="${url({c:k.id})}">${esc(k.name)}</a>`).join('')}
  <label style="margin-inline-start:auto">الترتيب <select data-sort aria-label="الترتيب"><option value="">الأحدث</option><option value="asc" ${sort==='asc'?'selected':''}>الأقل سعرًا</option><option value="desc" ${sort==='desc'?'selected':''}>الأعلى سعرًا</option><option value="disc" ${sort==='disc'?'selected':''}>الأعلى خصمًا</option></select></label></div>
  ${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty">${IC.search.replace('class="ico"','class="ico" style="width:48px;height:48px;margin:0 auto 12px;color:var(--brass)"')}<p>لا توجد منتجات مطابقة. جرّب قسمًا آخر أو كلمة بحث مختلفة.</p></div>`}</div>`;
}
function vProduct(id){
  const p=S.products.find(x=>x.id===id);

  const d=disc(p),rel=S.products.filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,4);
  return `<div class="wrap"><div class="crumbs"><a href="#/">الرئيسية</a> / <a href="#/shop?c=${esc(p.cat)}">${esc(catName(p.cat))}</a></div>
  <div class="pd"><div class="pic"><img src="${imgOf(p)}" alt="${esc(p.name)}"></div>
  <div><h1>${esc(p.name)}</h1><div class="price" style="margin:12px 0"><b>${egp(p.price)}</b>${p.old>p.price?`<s>${egp(p.old)}</s><span class="sale" style="position:static">وفّر ${nf.format(d)}%</span>`:''}</div>
  <p>${esc(p.desc)}</p>
  <p style="color:${p.stock===0?'var(--sale)':'var(--ok)'};font-weight:700">${p.stock===0?'غير متوفر حاليًا':'متوفر'}</p>
  <div class="cta" style="margin-top:16px"><span class="qty"><button data-act="pq" data-d="-1" aria-label="أقل">−</button><span id="pq">1</span><button data-act="pq" data-d="1" aria-label="أكثر">+</button></span>
  <button class="btn btn-teal" data-act="addq" data-id="${esc(p.id)}" ${p.stock===0?'disabled':''}>أضف إلى السلة</button>
  <a class="btn btn-line" target="_blank" rel="noopener noreferrer" href="${esc(wa('مرحبًا، أستفسر عن: '+p.name+' ('+nfe.format(p.price)+' ج.م)'))}">${IC.wa} اسأل عن المنتج</a></div>
  <p style="font-size:14px;color:var(--mute);margin-top:18px">الدفع: فودافون كاش أو عند الاستلام · <a class="link" href="#/page/returns">سياسة الاسترجاع</a></p></div></div>
  ${rel.length?`<div class="sh"><h2 style="font-size:24px;color:var(--teal)">منتجات مشابهة</h2></div><div class="grid">${rel.map(card).join('')}</div>`:''}</div>`;
}
function vCart(){
  const L=cartLines();
  if(!L.length)return `<div class="wrap empty">${IC.cart.replace('class="ico"','class="ico" style="width:48px;height:48px;margin:0 auto 12px;color:var(--brass)"')}<h2>سلتك فارغة</h2><p>أضف منتجات وستبقى محفوظة${S.user?' في حسابك':' هنا، وتُحفظ في حسابك بعد تسجيل الدخول'}.</p><a class="btn btn-teal" href="#/shop">ابدأ التسوق</a></div>`;
  const ship=+S.settings.shipping||0;
  return `<div class="wrap"><h1 style="font-size:30px;color:var(--teal);padding-top:28px">سلة التسوق</h1><div class="two"><div class="panel">${L.map(({p,q})=>`<div class="line"><img src="${imgOf(p)}" alt=""><div><h3><a href="#/p/${esc(p.id)}">${esc(p.name)}</a></h3><div class="price"><b>${egp(p.price)}</b>${p.old>p.price?`<s>${egp(p.old)}</s>`:''}</div><button class="rm" data-act="rm" data-id="${esc(p.id)}">حذف</button></div><div class="end"><span class="qty"><button data-act="qty" data-id="${esc(p.id)}" data-d="-1" aria-label="أقل">−</button><span>${nf.format(q)}</span><button data-act="qty" data-id="${esc(p.id)}" data-d="1" aria-label="أكثر">+</button></span></div></div>`).join('')}
  <p style="font-size:14px;color:var(--mute);margin:10px 0 0">${S.user?'سلتك محفوظة في حسابك، ويمكنك إكمال الطلب لاحقًا.':'سجّل الدخول لتُحفظ سلتك في حسابك وتطلبها في وقت لاحق.'}</p></div>
  <aside class="panel"><h2 style="font-size:22px;margin-bottom:10px">ملخص الطلب</h2><div class="sum"><span>المنتجات (${nf.format(cartCount())})</span><span>${egp(cartTotal())}</span></div>${ship?`<div class="sum"><span>الشحن</span><span>${egp(ship)}</span></div>`:'<div class="sum"><span>الشحن</span><span>يُحدد عند التأكيد</span></div>'}<div class="sum t"><span>الإجمالي</span><span>${egp(cartTotal()+ship)}</span></div><a class="btn btn-brass btn-block" style="margin-top:14px" href="#/checkout">متابعة الشراء</a></aside></div></div>`;
}
function vCheckout(){
  if(!cartLines().length){location.hash='#/cart';return ''}
  if(!S.user){return `<div class="wrap empty"><h2>سجّل الدخول لإتمام الطلب</h2><p>حسابك يتيح لك تتبع الطلب وحفظ السلة.</p><button class="btn btn-teal" data-act="login">تسجيل الدخول</button></div>`}
  const ship=+S.settings.shipping||0;
  return `<div class="wrap"><h1 style="font-size:30px;color:var(--teal);padding-top:28px">إتمام الطلب</h1><div class="two"><form class="panel" data-form="checkout" novalidate>
  <label class="f"><span>الاسم الكامل</span><input type="text" name="name" value="${esc(S.user.name==='عميل'?'':S.user.name)}" autocomplete="name" required maxlength="80"></label>
  <label class="f"><span>رقم الهاتف (واتساب)</span><input type="tel" name="phone" value="${S.user.type==='phone'?esc('0'+S.user.ident.slice(2)):''}" autocomplete="tel" inputmode="tel" required maxlength="20" dir="ltr" style="text-align:right"></label>
  <div class="row2"><label class="f"><span>المدينة / المحافظة</span><input type="text" name="city" value="السويس" required maxlength="60"></label><label class="f"><span>العنوان بالتفصيل</span><input type="text" name="address" required maxlength="200" autocomplete="street-address"></label></div>
  <label class="f"><span>ملاحظات <small>(اختياري)</small></span><textarea name="notes" maxlength="400" style="min-height:70px"></textarea></label>
  <div class="pay" role="radiogroup" aria-label="طريقة الدفع"><label><input type="radio" name="pay" value="vodafone" checked><span><b>فودافون كاش</b><br><small>حوّل على الرقم ${esc(phoneShow())} ثم أرسل صورة التحويل مع الفاتورة على واتساب.</small></span></label><label><input type="radio" name="pay" value="cod"><span><b>الدفع عند الاستلام</b><br><small>ادفع نقدًا عند وصول الطلب.</small></span></label></div>
  <p class="err" role="alert"></p><button class="btn btn-brass btn-block" type="submit">تأكيد الطلب وإرسال الفاتورة على واتساب</button>
  <p style="font-size:13px;color:var(--mute);margin:10px 0 0">بالضغط على تأكيد الطلب فأنت توافق على <a class="link" href="#/page/terms">شروط الاستخدام</a> و<a class="link" href="#/page/privacy">سياسة الخصوصية</a>.</p></form>
  <aside class="panel"><h2 style="font-size:22px;margin-bottom:10px">طلبك</h2>${cartLines().map(({p,q})=>`<div class="sum"><span>${esc(p.name)} × ${nf.format(q)}</span><span>${egp(p.price*q)}</span></div>`).join('')}${ship?`<div class="sum"><span>الشحن</span><span>${egp(ship)}</span></div>`:''}<div class="sum t"><span>الإجمالي</span><span>${egp(cartTotal()+ship)}</span></div></aside></div></div>`;
}
function invoiceText(o){
  const L=o.items.map(i=>`• ${i.name} × ${i.q} = ${nfe.format(i.price*i.q)} ج.م`).join('\n');
  return `طلب جديد رقم ${o.id}\n\nالاسم: ${o.name}\nالهاتف: ${o.phone}\nالمدينة: ${o.city}\nالعنوان: ${o.address}\n\nالمنتجات:\n${L}\n\n${o.shipping?`الشحن: ${nfe.format(o.shipping)} ج.م\n`:''}الإجمالي: ${nfe.format(o.total)} ج.م\nطريقة الدفع: ${o.pay==='vodafone'?'فودافون كاش':'الدفع عند الاستلام'}${o.notes?`\nملاحظات: ${o.notes}`:''}`;
}
function orderCard(o,adm){
  const idx=ST.findIndex(s=>s[0]===o.status),ds=new Date(o.ts).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
  return `<div class="order"><header><div><b dir="ltr">${esc(o.id)}</b> <span class="status ${esc(o.status)}">${esc(stName(o.status))}</span></div><span style="color:var(--mute)">${esc(ds)}</span></header>
  <div style="font-size:15px">${o.items.map(i=>`${esc(i.name)} × ${nf.format(i.q)}`).join(' · ')}</div>
  <div style="font-weight:700;color:var(--teal);margin:4px 0">الإجمالي: ${egp(o.total)} – ${o.pay==='vodafone'?'فودافون كاش':'الدفع عند الاستلام'}</div>
  ${adm?`<div style="font-size:14px;color:var(--mute)">${esc(o.name)} · <span dir="ltr">${esc(o.phone)}</span> · ${esc(o.city)} – ${esc(o.address)}</div><label style="display:block;margin-top:8px">تغيير الحالة <select data-st="${esc(o.id)}">${ST.map(s=>`<option value="${s[0]}" ${o.status===s[0]?'selected':''}>${s[1]}</option>`).join('')}<option value="cancelled" ${o.status==='cancelled'?'selected':''}>ملغي</option></select></label>`:''}
  ${o.status!=='cancelled'?`<ol class="tl" aria-label="حالة الطلب">${ST.map((s,i)=>`<li class="${i<=idx?'on':''}">${s[1]}</li>`).join('')}</ol>`:''}
  ${!adm?`<a class="btn btn-line btn-sm" target="_blank" rel="noopener noreferrer" href="${esc(wa('مرحبًا، أستفسر عن الطلب رقم '+o.id))}">${IC.wa} استفسر عن الطلب</a>`:''}</div>`;
}
function vDone(id){
  const o=S.orders.find(x=>x.id===id);
  if(!o)return `<div class="wrap empty"><p>لم يتم العثور على الطلب.</p><a class="btn btn-teal" href="#/account">طلباتي</a></div>`;
  return `<div class="wrap" style="max-width:720px;padding:36px 0"><div class="panel" style="text-align:center"><div style="color:var(--ok);margin-bottom:8px">${IC.shield.replace('class="ico"','class="ico" style="width:48px;height:48px;margin:0 auto"')}</div><h1 style="font-size:28px;color:var(--teal)">تم تسجيل طلبك</h1><p>رقم الطلب: <b dir="ltr">${esc(o.id)}</b></p>
  <p>لإتمام الطلب أرسل الفاتورة إلى المتجر على واتساب${o.pay==='vodafone'?`، ثم حوّل ${egp(o.total)} على فودافون كاش (${esc(phoneShow())}) وأرسل صورة التحويل`:''}.</p>
  <a class="btn btn-wa btn-block" target="_blank" rel="noopener noreferrer" href="${esc(wa(invoiceText(o)))}">${IC.wa} إرسال الفاتورة على واتساب</a>
  <p style="margin-top:14px"><a class="btn btn-line" href="#/account">تتبّع طلبي</a></p></div></div>`;
}
function vAccount(){

function resizeImage(file){
  return new Promise((res,rej)=>{
    if(!/^image\/(jpeg|png|webp)$/.test(file.type))return rej(new Error('نوع الصورة غير مدعوم'));
    if(file.size>8*1024*1024)return rej(new Error('حجم الصورة كبير (الحد 8 ميجا)'));
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const m=760,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8))};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('تعذر قراءة الصورة'))};im.src=url;
  });
}

  search(f){const q=new FormData(f).get('q').trim();location.hash=q?'#/shop?q='+encodeURIComponent(q):'#/shop'},
  async auth(f){
    const d=new FormData(f),mode=f.dataset.mode,ident=normIdent(d.get('ident')),pw=String(d.get('pw')||''),name=String(d.get('name')||'').trim();
    if(!ident)return showErr(f,'أدخل بريدًا إلكترونيًا صحيحًا أو رقم موبايل مصري صحيحًا.');

    else await AUTH.signIn(ident,pw);
    closeModal();renderHeader();render();toast('أهلًا بك');
  },
  async forgot(f){
    const ident=normIdent(new FormData(f).get('ident'));if(!ident)return showErr(f,'أدخل بريدًا إلكترونيًا أو رقم هاتف صحيحًا.');
    const ok=await AUTH.reset(ident);
    if(ok){closeModal();toast('أرسلنا رابط الاستعادة إلى بريدك إن كان مسجلًا لدينا')}
    else{closeModal();openModal(`<h2>استعادة كلمة المرور</h2><p>لاستعادة الوصول إلى حسابك تواصل مع خدمة العملاء على واتساب وسنساعدك بعد التحقق من هويتك.</p><a class="btn btn-wa btn-block" target="_blank" rel="noopener noreferrer" href="${esc(wa('مرحبًا، نسيت كلمة مرور حسابي ('+ident.v+')'))}">${IC.wa} تواصل عبر واتساب</a>`)}
  },
  async checkout(f){
    const d=Object.fromEntries(new FormData(f)),ph=normIdent(d.phone);
    if(String(d.name).trim().length<3)return showErr(f,'أدخل اسمك بالكامل.');
    if(!ph||ph.type!=='phone')return showErr(f,'أدخل رقم موبايل مصري صحيحًا.');
    if(String(d.city).trim().length<2||String(d.address).trim().length<5)return showErr(f,'أدخل المدينة والعنوان بالتفصيل.');
    const items=cartLines().map(({p,q})=>({id:p.id,name:p.name,price:p.price,q}));if(!items.length)return showErr(f,'السلة فارغة.');
    const ship=+S.settings.shipping||0;
    let o={id:'WD-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6).toUpperCase(),uid:S.user.id,name:String(d.name).trim(),phone:'0'+ph.v.slice(2),city:String(d.city).trim(),address:String(d.address).trim(),notes:String(d.notes||'').trim(),pay:d.pay==='cod'?'cod':'vodafone',items,shipping:ship,total:items.reduce((a,i)=>a+i.price*i.q,0)+ship,status:'new',ts:Date.now()};
    if(FB){
      if(!CFG.api)throw new Error('خادم الطلبات غير مُعدّ بعد. تواصل مع المتجر على واتساب.');
      const tok=await FB.auth.currentUser.getIdToken(),ac=new AbortController(),tm=setTimeout(()=>ac.abort(),45000);
      let r;
      try{r=await fetch(CFG.api.replace(/\/$/,'')+'/api/orders',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({items:items.map(i=>({id:i.id,q:i.q})),name:o.name,phone:o.phone,city:o.city,address:o.address,notes:o.notes,pay:o.pay})})}
      catch{throw new Error('تعذر الوصول لخادم الطلبات. أعد المحاولة بعد لحظات.')}
      finally{clearTimeout(tm)}
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.order)throw new Error(j.error||'تعذر إرسال الطلب، حاول مرة أخرى.');
      o=j.order;if(!S.orders.some(x=>x.id===o.id))S.orders.unshift(o);
    }else{const all=store.get('wd_orders',[]);all.push(o);store.set('wd_orders',all);loadLocalOrders()}
    S.cart=[];saveCart();renderHeader();
    const w=window.open(wa(invoiceText(o)),'_blank','noopener');
    location.hash='#/done/'+o.id;
    if(!w)toast('اضغط زر "إرسال الفاتورة على واتساب" لإتمام الطلب');
  },
  async adminlogin(f){
    const d=new FormData(f),key='wd_lock_admin';
    if(lockLeft(key))return showErr(f,`تم إيقاف المحاولات مؤقتًا. حاول بعد ${lockLeft(key)} دقيقة.`);
    const ph=normIdent(d.get('phone')),pin=String(d.get('pin')||'');let ok=false;
    if(ph&&ph.type==='phone'&&/^\d{4}$/.test(pin)){for(const a of CFG.admins){if(await pbk(ph.v+'|'+pin,a.salt)===a.hash)ok=true}}
    if(!ok){lockFail(key);return showErr(f,'بيانات الدخول غير صحيحة.')}
    lockOk(key);S.isAdmin=true;loadLocalOrders();render();toast('مرحبًا بك في لوحة التحكم');
  },
  async cat(f){const n=String(new FormData(f).get('name')).trim();if(!n)return;await put('categories',{id:uid('c'),name:n,ord:Date.now()});toast('تمت إضافة القسم');render()},
  async store(f){
    const d=Object.fromEntries(new FormData(f)),ph=String(d.phone).replace(/\D/g,'');
    if(!/^20\d{10}$/.test(ph))return showErr(f,'رقم الواتساب بصيغة دولية مثل 201021776980');
    const url=u=>{u=String(u||'').trim();return u===''||/^https:\/\//.test(u)?u:null};
    if(url(d.fb)===null||url(d.ig)===null)return showErr(f,'روابط التواصل يجب أن تبدأ بـ https://');
    await putDoc('store',{name:String(d.name).trim(),tagline:String(d.tagline).trim(),address:String(d.address).trim(),phone:ph,email:String(d.email).trim(),fb:String(d.fb).trim(),ig:String(d.ig).trim(),shipping:Math.max(0,+d.shipping||0)});
    toast('تم حفظ بيانات المتجر');render();
  },
  async pages(f){const d=Object.fromEntries(new FormData(f)),o={...S.pages};Object.keys(PAGE_TITLES).forEach(k=>o[k]=String(d[k]||''));await putDoc('pages',o);toast('تم حفظ الصفحات');render()},
  async prod(f){
    const d=Object.fromEntries(new FormData(f)),price=Math.round(+d.price),old=Math.round(+d.old||0);
    if(!String(d.name).trim())return showErr(f,'أدخل اسم المنتج.');
    if(!(price>0))return showErr(f,'أدخل سعرًا صحيحًا.');
    if(old&&old<=price)return showErr(f,'السعر قبل الخصم يجب أن يكون أكبر من السعر الحالي.');
    await put('products',{id:d.id,cat:d.cat,name:String(d.name).trim(),price,old,desc:String(d.desc||'').trim(),stock:Math.max(0,Math.round(+d.stock)),type:d.type,color:/^#[0-9a-f]{6}$/i.test(d.color)?d.color:'#0E4A47',img:tmpImg});
    closeModal();toast('تم حفظ المنتج');render();
  }
};
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const b=$('button[type=submit]',f);if(b)b.disabled=true;
  try{await FORM[f.dataset.form](f)}catch(err){showErr(f,fbMsg(err))}finally{if(b)b.disabled=false}
});
function fbMsg(e){
  const c=e&&e.code||'';
  if(/auth\/(invalid-credential|wrong-password|user-not-found|invalid-login-credentials)/.test(c))return 'بيانات الدخول غير صحيحة.';
  if(c==='auth/email-already-in-use')return 'هذا الحساب مسجّل بالفعل، سجّل الدخول.';
  if(c==='auth/weak-password')return 'كلمة المرور ضعيفة، استخدم 8 أحرف أو أكثر.';
  if(c==='auth/too-many-requests')return 'محاولات كثيرة. حاول لاحقًا.';
  if(c==='permission-denied'||/permission/i.test(c))return 'ليست لديك صلاحية لهذه العملية.';
  return e&&e.message||'حدث خطأ، حاول مرة أخرى.';
}

/* ===== التوجيه والعرض ===== */
function parse(){const h=location.hash.slice(1)||'/',[p,qs]=h.split('?');return{parts:p.split('/').filter(Boolean),q:Object.fromEntries(new URLSearchParams(qs||''))}}
function render(){
  const{parts,q}=parse(),k=parts[0]||'';let html;
  if(!S.ready)html='<div class="wrap empty">جارٍ التحميل…</div>';
  else if(k==='')html=vHome();else if(k==='shop')html=vShop(q);else if(k==='p')html=vProduct(parts[1]);
  else if(k==='cart')html=vCart();else if(k==='checkout')html=vCheckout();else if(k==='done')html=vDone(parts[1]);
  else if(k==='account')html=vAccount();else if(k==='page')html=vPage(parts[1]);else if(k==='admin')html=vAdmin(q);
  else html='<div class="wrap empty"><h2>الصفحة غير موجودة</h2><a class="btn btn-teal" href="#/">الرئيسية</a></div>';
  document.title=S.settings.name||'المتجر';
  renderHeader();$('#app').innerHTML=html;renderFooter();
}
window.addEventListener('hashchange',()=>{S.menu=false;render();window.scrollTo(0,0)});

/* ===== الإقلاع ===== */
(async function boot(){
  loadLocal();
  if(CFG.firebase){
    try{await initFirebase()}catch(e){console.warn(e);FB=null;loadLocal();toast('تعذر الاتصال بقاعدة البيانات، يعمل المتجر في الوضع المحلي')}
  }
  if(!FB){
    const sid=store.get('wd_session',null),u=sid&&store.get('wd_users',[]).find(x=>x.id===sid);
    if(u){S.user={id:u.id,name:u.name,ident:u.ident,type:u.type}}
    loadCart();loadLocalOrders();
  }
  render();
})();
})();
</script>
